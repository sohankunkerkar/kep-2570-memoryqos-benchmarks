apiVersion: v1
kind: Pod
metadata:
  name: memqos-guaranteed-test
  namespace: default
spec:
  containers:
  - name: test
    image: python:3.12-slim
    command: ["sleep", "60"]
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "100m"
  restartPolicy: Never
