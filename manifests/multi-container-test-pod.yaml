apiVersion: v1
kind: Pod
metadata:
  name: memqos-multi-container
spec:
  containers:
  - name: container-a
    image: python:3.12-slim
    command: ["sleep", "60"]
    resources:
      requests:
        memory: "128Mi"
      limits:
        memory: "256Mi"
  - name: container-b
    image: python:3.12-slim
    command: ["sleep", "60"]
    resources:
      requests:
        memory: "64Mi"
      limits:
        memory: "128Mi"
  restartPolicy: Never
