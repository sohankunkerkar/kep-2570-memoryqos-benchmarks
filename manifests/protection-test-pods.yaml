apiVersion: v1
kind: Pod
metadata:
  name: memqos-protected
  namespace: default
spec:
  containers:
  - name: holder
    image: python:3.12-slim
    command:
    - python3
    - -c
    - |
      import time
      # Allocate and hold 200 MiB (below requests=256Mi)
      chunks = []
      for i in range(20):
          c = bytearray(10 * 1024 * 1024)
          for j in range(0, len(c), 4096):
              c[j] = 1
          chunks.append(c)
      print(f"Holding {len(chunks)*10} MiB", flush=True)
      while True:
          time.sleep(10)
    resources:
      requests:
        memory: "256Mi"
      limits:
        memory: "512Mi"
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: memqos-aggressor
  namespace: default
spec:
  containers:
  - name: eater
    image: python:3.12-slim
    command:
    - python3
    - -c
    - |
      import time
      chunks = []
      total = 0
      print("Aggressor starting", flush=True)
      while True:
          try:
              c = bytearray(10 * 1024 * 1024)
              for i in range(0, len(c), 4096):
                  c[i] = 1
              chunks.append(c)
              total += 10
              print(f"allocated={total} MiB", flush=True)
              time.sleep(0.5)
          except MemoryError:
              print(f"MemoryError at {total} MiB", flush=True)
              time.sleep(5)
    resources:
      requests:
        memory: "64Mi"
      limits:
        memory: "512Mi"
  restartPolicy: Never
